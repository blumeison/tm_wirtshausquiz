<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beamer – Wirtshausquiz</title>
<link rel="icon" type="image/png" href="../logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patua+One&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  /* Zwei Fenster, eine Datei: beamer.html ist die Steuerung am Laptop,
     beamer.html#screen das Bild am Beamer. Die Steuerung lädt den Abend einmal
     und schickt ihn per BroadcastChannel ans Beamer-Fenster — danach braucht
     nur noch YouTube Internet. */
  :root { --red: #e51324; --yellow: #ffcc00; --green: #3aaa35; --cream: #f6efe2; --wood: #3f2c20; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 400 15px/1.45 Rubik, Arial, sans-serif; background: #17130f; color: var(--cream); }

  /* ---- Bühne: 16:9, alle Größen in cqw, damit Vorschau und Beamer gleich aussehen ---- */
  .stage { container-type: inline-size; aspect-ratio: 16 / 9; width: 100%; position: relative; overflow: hidden;
           background: radial-gradient(ellipse at 50% 35%, #5a4030 0%, #3f2c20 55%, #22170f 100%); color: var(--cream);
           display: flex; flex-direction: column; padding: 4cqw 5cqw; }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .7cqw;
           background: linear-gradient(90deg, var(--red) 0 45%, var(--green) 45% 63%, var(--yellow) 63% 81%, #e6007e 81%); }
  .s-top { display: flex; justify-content: space-between; align-items: center; font: 600 1.5cqw/1 Rubik, sans-serif;
           text-transform: uppercase; letter-spacing: .15cqw; opacity: .8; }
  .s-top img { height: 3.4cqw; }
  .s-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 1.6cqw; }
  .s-big { font: 400 8cqw/1 'Patua One', Georgia, serif; color: var(--cream); }
  .s-big.red { color: #ff4a57; }
  .s-sub { font: 500 2.4cqw/1.3 Rubik, sans-serif; opacity: .85; }
  .s-logo { height: 10cqw; }
  .s-q { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2.2cqw; }
  .s-prompt { font: 500 3.4cqw/1.3 Rubik, sans-serif; }
  .s-prompt.m { font-size: 2.8cqw; } .s-prompt.l { font-size: 2.3cqw; }
  .s-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw 2cqw; }
  .s-opts div { background: rgba(246,239,226,.1); border: .15cqw solid rgba(246,239,226,.25); border-radius: 1cqw;
                padding: 1cqw 1.6cqw; font: 500 2.3cqw/1.25 Rubik, sans-serif; display: flex; gap: 1.2cqw; align-items: center; }
  .s-opts b { font: 400 2.8cqw/1 'Patua One', serif; color: var(--yellow); }
  .s-opts div.ok { background: var(--green); border-color: var(--green); color: #fff; }
  .s-opts div.ok b { color: #fff; }
  .s-opts div.dim { opacity: .35; }
  .s-tag { align-self: flex-start; background: var(--yellow); color: #3a2a00; font: 700 1.6cqw/1 Rubik, sans-serif;
           padding: .7cqw 1.4cqw; border-radius: 99cqw; }
  .s-ans { background: var(--green); color: #fff; border-radius: 1.2cqw; padding: 1.6cqw 2.4cqw;
           font: 400 4cqw/1.15 'Patua One', Georgia, serif; }
  .s-ans small { display: block; font: 600 1.4cqw/1 Rubik, sans-serif; text-transform: uppercase; letter-spacing: .15cqw; opacity: .85; margin-bottom: .8cqw; }
  .s-media { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .s-media > * { height: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 0; border-radius: 1cqw; background: #000; }
  .s-media .ph { display: grid; place-items: center; font: 500 2cqw Rubik, sans-serif; color: #aaa; }
  .s-media img { object-fit: contain; background: transparent; aspect-ratio: auto; }
  .s-note { font-size: 4cqw; }
  .s-stand { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2cqw; justify-content: center; }
  .s-teams { list-style: none; display: flex; flex-wrap: wrap; gap: 1.2cqw; justify-content: center; }
  .s-teams li { background: rgba(246,239,226,.1); border: .15cqw solid rgba(246,239,226,.25); border-radius: 1cqw;
                padding: 1cqw 2cqw; font: 400 2.8cqw/1.15 'Patua One', serif; text-align: center; }
  .s-teams small { display: block; font: 600 1.3cqw/1.3 Rubik, sans-serif; color: var(--yellow); }
  .s-list { list-style: none; display: flex; flex-direction: column; gap: 1.5cqw; width: 82%; margin: 0 auto; }
  .s-list li { display: flex; gap: 2cqw; align-items: center; font: 400 2cqw/1.35 Rubik, sans-serif; }
  .s-list li > span { font-size: 3.6cqw; width: 5cqw; text-align: center; }
  .s-list b { display: block; font: 400 2.7cqw/1.15 'Patua One', serif; color: var(--yellow); }
  .s-hints { list-style: none; display: flex; flex-direction: column; gap: .9cqw; }
  .s-hints li { display: flex; gap: 1.5cqw; align-items: baseline; font: 500 2.3cqw/1.3 Rubik, sans-serif; opacity: .65; }
  .s-hints li.new { opacity: 1; font-size: 2.7cqw; }
  .s-hints li b { font: 400 2.6cqw/1 'Patua One', serif; color: var(--yellow); min-width: 2.5cqw; }
  .s-ladder { align-self: flex-start; background: var(--red); color: #fff; border-radius: 99cqw; padding: 1cqw 2.4cqw; font: 500 2.2cqw Rubik, sans-serif; }
  .s-rows { list-style: none; display: grid; gap: .8cqw 3cqw; width: 70%; margin: 0 auto; }
  .s-rows.two { grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(7, auto); width: 100%; }
  .s-rows li { display: flex; align-items: center; gap: 1.4cqw; background: rgba(246,239,226,.08); border-radius: 1cqw;
               padding: .7cqw 1.4cqw; font: 500 2.3cqw/1.2 Rubik, sans-serif; }
  .s-rows li b { font: 400 2.6cqw/1 'Patua One', serif; min-width: 3cqw; color: var(--yellow); }
  .s-rows li span { flex: 1; }
  .s-rows li i { font: 400 2.8cqw/1 'Patua One', serif; font-style: normal; }
  .s-rows li.p1 { background: var(--yellow); color: #3a2a00; } .s-rows li.p1 b { color: #3a2a00; }
  .s-rows li.p2 { background: rgba(246,239,226,.28); } .s-rows li.p3 { background: rgba(205,127,50,.45); }

  /* ---- Beamer-Fenster ---- */
  body.screen { background: #000; display: grid; place-items: center; overflow: hidden; cursor: none; }
  body.screen .stage { width: min(100vw, calc(100vh * 16 / 9)); }
  .start { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; text-align: center;
           font: 500 22px/1.5 Rubik, sans-serif; cursor: pointer; z-index: 5; }
  .start b { display: block; font: 400 40px 'Patua One', serif; color: var(--yellow); }

  /* ---- Steuerung ---- */
  .ctl { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 18px; padding: 14px 18px; max-width: 1500px; margin: 0 auto; }
  .ctl-bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { font: 600 15px Rubik, sans-serif; color: var(--cream); background: #3a332b; border: 1px solid #5a5047;
         border-radius: 99px; padding: 9px 18px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--yellow); }
  .btn.red { background: var(--red); border-color: var(--red); }
  .btn.big { font-size: 18px; padding: 12px 26px; }
  .pos { font: 400 22px 'Patua One', serif; min-width: 90px; text-align: center; }
  select.jump { font: 15px Rubik, sans-serif; padding: 8px; border-radius: 8px; max-width: 340px; }
  .hint { font-size: 13px; opacity: .65; }
  .col h3 { font: 600 12px Rubik, sans-serif; text-transform: uppercase; letter-spacing: .12em; opacity: .6; margin: 14px 0 6px; }
  .col h3:first-child { margin-top: 0; }
  .next { opacity: .8; }
  .info { background: #241e19; border: 1px solid #3a332b; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .info .ans { font: 400 22px/1.2 'Patua One', serif; color: #7fd47a; }
  .info .bg { font-size: 15px; line-height: 1.5; }
  .info .mute { opacity: .6; font-size: 13px; }
  .player iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; }
  .player audio, .player video { width: 100%; }
  .player .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .warn { background: #5a1d1d; border-radius: 8px; padding: 8px 12px; }
  a { color: var(--yellow); }
  @media (max-width: 900px) { .ctl { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"><p style="padding:2rem">Lädt …</p></div>

<script src="assets/quiz-data.js?v=3"></script>
<script>
(function () {
  'use strict';
  var esc = WQD.esc, TYPE = WQD.TYPE;
  var SCREEN = location.hash === '#screen';
  var ch = new BroadcastChannel('wq-beamer');
  var root = document.getElementById('root');
  var D = null, deck = [], idx = 0;

  // ---- Ablauf: aus dem Abend wird eine flache Folienliste --------------------
  // Pro Runde: Rundentitel → Fragen → „Zettel abgeben“ → Auflösung mit Antworten.
  // Handout-Runden stehen am Zettel, am Beamer läuft nur die Auflösung.
  function buildDeck(D) {
    var s = [{ k: 'title' }, { k: 'teams' }, { k: 'rules' }, { k: 'prizes' }];
    var played = D.rounds.filter(function (r) { return r.questions.length; });
    var pauseAfter = played.length >= 3 ? played[Math.floor(played.length / 2) - 1] : null;
    played.forEach(function (r) {
      s.push({ k: 'round', r: r });
      if (r.kind !== 'HANDOUT') {
        r.questions.forEach(function (q, i) { s.push({ k: 'q', r: r, i: i, q: q }); });
        s.push({ k: 'collect', r: r });
      }
      s.push({ k: 'solve', r: r });
      r.questions.forEach(function (q, i) { s.push({ k: 'a', r: r, i: i, q: q }); });
      s.push({ k: 'stand', upto: r.n - 1, r: r });
      if (r === pauseAfter) s.push({ k: 'pause', r: r });
    });
    // Masterfrage im Countdown: Hinweis für Hinweis, nach jedem dürfen die Teams tippen.
    var mh = D.master && D.master.payload && D.master.payload.hints;
    if (mh && mh.length) {
      mh.forEach(function (h, i) { s.push({ k: 'mhint', n: i + 1, q: D.master, label: 'Masterfrage' }); });
      s.push({ k: 'a', label: 'Masterfrage', q: D.master });
    } else if (D.master) {
      s.push({ k: 'q', label: 'Masterfrage', q: D.master }, { k: 'a', label: 'Masterfrage', q: D.master });
    }
    var last = D.rounds.length - 1 + (D.master ? 1 : 0);
    s.push({ k: 'stand', upto: last, final: true });
    if (D.tiebreak) {
      s.push({ k: 'q', label: 'Stechfrage', q: D.tiebreak }, { k: 'a', label: 'Stechfrage', q: D.tiebreak });
      s.push({ k: 'stand', upto: last, final: true, tb: true });
    }
    s.push({ k: 'end' });
    return s;
  }
  function label(sl) {
    switch (sl.k) {
      case 'title': return 'Begrüßung';
      case 'teams': return 'Die Teams';
      case 'rules': return 'Regeln';
      case 'prizes': return 'Finale & Preise';
      case 'pause': return 'Pause';
      case 'mhint': return 'Masterfrage · Hinweis ' + sl.n;
      case 'round': return 'Runde ' + sl.r.n + ': ' + sl.r.title;
      case 'q': return (sl.label || 'R' + sl.r.n + ' · Frage ' + (sl.i + 1)) + ' — ' + sl.q.prompt.slice(0, 60);
      case 'collect': return 'R' + sl.r.n + ' · Zettel abgeben';
      case 'solve': return 'R' + sl.r.n + ' · Auflösung';
      case 'stand': return sl.tb ? 'Endstand nach Stechfrage' : sl.final ? 'Endstand' : 'Zwischenstand nach Runde ' + sl.r.n;
      case 'a': return (sl.label ? sl.label + ' · Antwort' : 'R' + sl.r.n + ' · Antwort ' + (sl.i + 1)) + ' — ' + sl.q.answer;
      default: return 'Schluss';
    }
  }

  // ---- Folien zeichnen (Beamer und Vorschau teilen sich das) ---------------
  function top(sl) {
    var left = sl.label ? sl.label : sl.r ? 'Runde ' + sl.r.n + (sl.q ? ' · Frage ' + (sl.i + 1) + ' von ' + sl.r.questions.length : '') : '';
    return '<div class="s-top"><span>' + esc(left) + '</span><img src="../logo-mark-white.png" alt=""></div>';
  }
  function promptCls(t) { return t.length > 220 ? ' l' : t.length > 130 ? ' m' : ''; }
  function optsHtml(q, reveal) {
    var o = (q.payload && q.payload.options) || [];
    if (q.type !== 'MULTIPLE_CHOICE' || !o.length) return '';
    return '<div class="s-opts">' + o.map(function (t, i) {
      var c = reveal ? (i === q.payload.correctIndex ? ' class="ok"' : ' class="dim"') : '';
      return '<div' + c + '><b>' + 'ABCDEFGH'[i] + '</b>' + esc(t) + '</div>';
    }).join('') + '</div>';
  }
  function render(sl, preview) {
    var D0 = D || {};
    switch (sl.k) {
      case 'title':
        return '<div class="s-center"><img class="s-logo" src="../logo-mark-white.png" alt="">'
          + '<div class="s-big">' + esc(D0.title || 'Wirtshausquiz') + '</div>'
          + '<div class="s-sub">' + esc([D0.event && D0.event.dateLong, D0.event && D0.event.venueShort].filter(Boolean).join(' · ')) + '</div></div>';
      case 'round':
        return top({}) + '<div class="s-center"><div class="s-big red">Runde ' + sl.r.n + '</div>'
          + '<div class="s-sub" style="font-size:3.4cqw">' + esc(sl.r.title) + '</div>'
          + '<div class="s-sub">' + sl.r.questions.length + ' Fragen</div></div>';
      case 'collect':
        return top({ r: sl.r }) + '<div class="s-center"><div class="s-big">Stifte weg!</div>'
          + '<div class="s-sub">Bringt euren Zettel zu uns nach vorne —<br>wir werten aus, ihr hört gleich die Auflösung.</div></div>';
      case 'solve':
        return top({}) + '<div class="s-center"><div class="s-sub">Runde ' + sl.r.n + '</div><div class="s-big red">Auflösung</div></div>';
      case 'stand': return standHtml(sl);
      case 'teams': return teamsHtml();
      case 'rules': return rulesHtml(D0);
      case 'prizes': return prizesHtml(D0);
      case 'mhint': return masterHtml(sl);
      case 'pause':
        return top({}) + '<div class="s-center"><div class="s-big red">Pause</div>'
          + '<div class="s-sub">Zeit für ein Krügerl — gleich geht’s weiter mit Runde ' + (sl.r.n + 1) + '.</div></div>';
      case 'end':
        return '<div class="s-center"><img class="s-logo" src="../logo-mark-white.png" alt=""><div class="s-big">Danke fürs Mitraten!</div>'
          + '<div class="s-sub">Gleich gibt’s die Siegerehrung.</div></div>';
    }
    var q = sl.q, m = q.media, p = q.payload || {}, reveal = sl.k === 'a', body = '';
    if (!reveal && q.type === 'ESTIMATE') body += '<span class="s-tag">Schätzfrage' + (p.unit ? ' · Antwort in ' + esc(p.unit) : '') + '</span>';
    if (!reveal && m && !m.video) body += '<span class="s-tag">🎵 Hört gut zu</span>';
    body += '<div class="s-prompt' + promptCls(q.prompt) + '">' + esc(q.prompt) + '</div>';
    body += optsHtml(q, reveal);
    if (q.type === 'IMAGE' && p.imageUrl) body += '<div class="s-media"><img src="' + esc(p.imageUrl) + '" alt=""></div>';
    if (!reveal && m && m.video) {
      body += '<div class="s-media">' + (preview || m.kind === 'missing'
        ? '<div class="ph">🎬 ' + (m.kind === 'missing' ? 'Video fehlt noch' : 'Video läuft am Beamer') + '</div>'
        : '<div id="vmount"></div>') + '</div>';
    }
    if (reveal && q.type !== 'MULTIPLE_CHOICE') body += '<div class="s-ans"><small>Richtige Antwort</small>' + esc(q.answer) + '</div>';
    return top(sl) + '<div class="s-q">' + body + '</div>';
  }

  // ---- Begrüßung: Teams, Regeln, Preise ------------------------------------
  function playedRounds(D0) { return (D0.rounds || []).filter(function (r) { return r.questions.length; }); }
  function teamsHtml() {
    var ts = LIVE ? LIVE.teams : [], anyIn = LIVE && Object.keys(LIVE.checkin).length > 0;
    if (anyIn) ts = ts.filter(function (t) { return LIVE.checkin[t.id]; });
    return top({ label: 'Heute dabei' }) + '<div class="s-stand"><div class="s-big" style="font-size:5cqw;text-align:center">'
      + ts.length + ' Teams</div><ul class="s-teams">' + ts.map(function (t) {
        return '<li>' + esc(t.name) + (t.promo ? '<small>🍺 Early Bird · Freirunde</small>' : '') + '</li>';
      }).join('') + '</ul></div>';
  }
  function rulesHtml(D0) {
    var rs = playedRounds(D0), n = rs.map(function (r) { return r.questions.length; });
    var same = n.every(function (x) { return x === n[0]; });
    var pause = rs.length >= 3 ? Math.floor(rs.length / 2) : 0;
    var items = [
      ['📝', rs.length + ' Runden' + (same && n.length ? ' à ' + n[0] + ' Fragen' : ''), 'Antworten auf euren Zettel. Bei Multiple Choice den Buchstaben einkreisen.'],
      ['🔄', 'Nach jeder Runde', 'Zettel zu uns nach vorne — wir werten aus, ihr hört die Auflösung — dann Zwischenstand.']
    ];
    if (pause) items.push(['🍺', 'Nach Runde ' + pause + ': Pause', 'Zeit zum Durchschnaufen und Nachbestellen.']);
    if (D0.master) items.push(['👑', 'Zum Schluss: die Masterfrage', 'Die Hinweise sammeln sich über den ganzen Abend — achtet auf den roten Faden!']);
    items.push(['📵', 'Handy bleibt in der Tasche', 'Googeln ist Ehrensache.']);
    return top({ label: 'So läuft’s' }) + listHtml('So läuft’s', items);
  }
  function prizesHtml(D0) {
    var items = [];
    if (D0.master) {
      var lad = (D0.master.payload && D0.master.payload.ladder) || [];
      items.push(['👑', 'Masterfrage', 'Hinweis für Hinweis. Jedes Team hat einen Tipp — je früher, desto mehr Punkte'
        + (lad.length ? ': ' + lad.join(' · ') : '') + '. Falsch gibt 0.']);
    }
    items.push(['🏆', 'Plätze 1 bis 3', 'Pokale und Geschenkkörbe.']);
    items.push(['⚖️', 'Gleichstand am Podest?', 'Stechfrage: alle betroffenen Teams schätzen — wer am nächsten dran ist, liegt vorne. Egal wie viele Teams gleichauf sind.']);
    return top({ label: 'Finale & Preise' }) + listHtml('Finale & Preise', items);
  }
  function listHtml(title, items) {
    return '<div class="s-stand"><div class="s-big" style="font-size:5cqw;text-align:center">' + esc(title) + '</div><ul class="s-list">'
      + items.map(function (it) { return '<li><span>' + it[0] + '</span><div><b>' + esc(it[1]) + '</b>' + esc(it[2]) + '</div></li>'; }).join('')
      + '</ul></div>';
  }
  function masterHtml(sl) {
    var p = sl.q.payload || {}, hints = p.hints || [], lad = p.ladder || [];
    return top({ label: 'Finale · Masterfrage' }) + '<div class="s-q">'
      + '<div class="s-prompt m">' + esc(sl.q.prompt) + '</div>'
      + '<ol class="s-hints">' + hints.slice(0, sl.n).map(function (h, i) {
        return '<li' + (i === sl.n - 1 ? ' class="new"' : '') + '><b>' + (i + 1) + '</b>' + esc(h) + '</li>';
      }).join('') + '</ol>'
      + '<div class="s-ladder">Tipp jetzt: <b>' + (lad[sl.n - 1] != null ? lad[sl.n - 1] : '') + ' Punkte</b> — Karte hoch!</div></div>';
  }

  // Punkte kommen aus api/live.php: die Steuerung holt sie und reicht sie ans Beamer-Fenster weiter.
  var LIVE = null;
  function standHtml(sl) {
    var tbv = sl.tb && D && D.tiebreak && D.tiebreak.payload ? D.tiebreak.payload.value : null;
    var rows = LIVE ? WQD.table(LIVE, sl.upto, tbv) : [];
    var head = '<div class="s-top"><span>' + (sl.tb ? 'Nach der Stechfrage' : sl.final ? 'Endstand' : 'Nach Runde ' + sl.r.n) + '</span><img src="../logo-mark-white.png" alt=""></div>';
    var title = '<div class="s-big' + (sl.final ? ' red' : '') + '" style="font-size:5cqw;text-align:center">' + (sl.final ? 'Endstand' : 'Zwischenstand') + '</div>';
    if (!rows.some(function (r) { return r.per[sl.upto] != null; })) {
      return head + '<div class="s-center">' + title + '<div class="s-sub">Die Punkte werden gerade eingetragen …</div></div>';
    }
    return head + '<div class="s-stand">' + title + '<ol class="s-rows' + (rows.length > 7 ? ' two' : '') + '">' + rows.map(function (r) {
      return '<li class="p' + r.rank + '"><b>' + r.rank + '</b><span>' + esc(r.name) + '</span><i>' + r.total + '</i></li>';
    }).join('') + '</ol></div>';
  }

  // ---- Beamer-Fenster -------------------------------------------------------
  var player = null, vEl = null, ytReady = false, pendingMount = null;
  function mountVideo(sl) {
    player = null; vEl = null;
    var el = document.getElementById('vmount'), m = sl.q && sl.q.media;
    if (!el || !m) return;
    if (m.kind === 'file') {
      el.outerHTML = '<video id="vfile" src="' + esc(m.src) + '" preload="auto" playsinline></video>';
      vEl = document.getElementById('vfile');
      vEl.addEventListener('loadedmetadata', function () { vEl.currentTime = m.start || 0; });
      return;
    }
    if (!ytReady) { pendingMount = sl; return; }
    player = new YT.Player('vmount', {
      host: 'https://www.youtube-nocookie.com', videoId: m.id,
      playerVars: { start: Math.floor(m.start || 0), end: m.end ? Math.ceil(m.end) : undefined, rel: 0, controls: 0, playsinline: 1, modestbranding: 1 }
    });
  }
  function mediaCmd(cmd) {
    var m = deck[idx] && deck[idx].q && deck[idx].q.media;
    if (vEl) {
      if (cmd === 'restart') vEl.currentTime = (m && m.start) || 0;
      if (cmd === 'pause') vEl.pause(); else vEl.play();
      return;
    }
    if (!player || !player.playVideo) return;
    if (cmd === 'restart') player.seekTo((m && m.start) || 0, true);
    if (cmd === 'pause') player.pauseVideo(); else player.playVideo();
  }
  function screen() {
    document.body.className = 'screen';
    root.innerHTML = '<div class="stage" id="stage"></div>'
      + '<div class="start" id="start"><div><b>Beamer-Fenster</b>Dieses Fenster auf den Beamer ziehen,<br>dann hier klicken → Vollbild.</div></div>';
    document.getElementById('start').onclick = function () {
      this.remove();
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    };
    window.onYouTubeIframeAPIReady = function () { ytReady = true; if (pendingMount && pendingMount === deck[idx]) mountVideo(pendingMount); };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    var shown = -1, shownLive = '';
    ch.onmessage = function (e) {
      var msg = e.data;
      if (msg.t === 'state') {
        if (msg.D) { D = msg.D; deck = buildDeck(D); shown = -1; }
        var liveKey = JSON.stringify(msg.live || null);
        if (liveKey !== shownLive) { shownLive = liveKey; LIVE = msg.live; if (deck[idx] && needsLive(deck[idx])) shown = -1; }
        idx = msg.idx;
        if (idx !== shown && deck[idx]) {
          shown = idx;
          document.getElementById('stage').innerHTML = render(deck[idx], false);
          mountVideo(deck[idx]);
        }
      } else if (msg.t === 'media') mediaCmd(msg.cmd);
    };
    ch.postMessage({ t: 'hello' });
  }

  // ---- Steuerung am Laptop --------------------------------------------------
  function broadcast(full) { ch.postMessage({ t: 'state', idx: idx, D: full ? D : null, live: LIVE }); }
  function go(n) {
    idx = Math.max(0, Math.min(deck.length - 1, n));
    try { localStorage.setItem('wq-beamer-idx', idx); } catch (e) {}
    broadcast(false); draw();
    if (needsLive(deck[idx])) fetchLive();
  }
  function needsLive(sl) { return sl.k === 'stand' || sl.k === 'teams'; }
  // Holt die Punkte und hält nebenbei die Backoffice-Anmeldung wach (alle 30 s).
  var liveErr = '';
  function fetchLive() {
    return WQD.api('live.php').then(function (d) {
      LIVE = d; liveErr = '';
    }, function (e) {
      liveErr = e.status === 401 ? 'Abgemeldet — im Backoffice neu anmelden, dann hier „Aktualisieren“.' : 'Punkte nicht erreichbar (' + e.message + ')';
    }).then(function () {
      broadcast(false);
      if (needsLive(deck[idx])) { drawnIdx = -1; draw(); }
    });
  }
  function fmtTime(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function playerHtml(q) {
    var m = q.media;
    if (!m) return '';
    var when = (m.start ? ' ab ' + fmtTime(m.start) : '') + (m.end ? ' bis ' + fmtTime(m.end) : '');
    if (m.kind === 'missing') return '<div class="warn">Clip fehlt noch.' + (m.search
      ? ' <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(m.search) + '">Auf YouTube suchen</a> und im Backoffice bei der Frage eintragen.' : '') + '</div>';
    if (m.video) return '<div class="player"><div class="mute">🎬 Video am Beamer' + when + '</div><div class="row">'
      + '<button class="btn red" data-media="play">▶ Abspielen</button><button class="btn" data-media="pause">⏸ Pause</button>'
      + '<button class="btn" data-media="restart">⟲ Von vorn</button></div></div>';
    if (m.kind === 'youtube') return '<div class="player"><div class="mute">🎵 Ton am Laptop' + when + ' — hier auf Play drücken</div>'
      + '<iframe src="https://www.youtube-nocookie.com/embed/' + m.id + '?rel=0' + (m.start ? '&start=' + Math.floor(m.start) : '') + (m.end ? '&end=' + Math.ceil(m.end) : '')
      + '" allow="autoplay; encrypted-media" title="Hörfrage"></iframe>'
      + '<a class="mute" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=' + m.id + (m.start ? '&t=' + Math.floor(m.start) : '') + '">Falls das Einbetten gesperrt ist: auf YouTube öffnen</a></div>';
    return '<div class="player"><div class="mute">🎵 Ton am Laptop' + when + '</div><audio controls preload="auto" src="' + esc(m.src) + '#t=' + (m.start || 0) + '"></audio></div>';
  }
  function infoHtml(sl) {
    if (sl.k === 'mhint') {
      var mp = sl.q.payload || {};
      return '<div class="info"><div class="mute">Hinweis ' + sl.n + ' von ' + (mp.hints || []).length + ' — jetzt ' + ((mp.ladder || [])[sl.n - 1] || '') + ' Punkte</div>'
        + '<div class="ans">' + esc(sl.q.answer) + '</div>'
        + '<div class="mute">Helfer sammelt die hochgehaltenen Karten ein und schreibt „' + sl.n + '“ drauf.</div>'
        + (mp.clueExplanation ? '<div class="bg">' + esc(mp.clueExplanation) + '</div>' : '') + '</div>';
    }
    if (sl.k === 'teams') {
      return '<div class="info"><div class="row" style="display:flex;gap:8px"><button class="btn" data-live="1">↻ Aktualisieren</button>'
        + '<a class="btn" href="live.html#checkin" target="_blank">Check-in</a></div>'
        + '<div class="mute">Zeigt die eingecheckten Teams (oder alle, solange noch niemand eingecheckt ist).</div></div>';
    }
    if (sl.k === 'stand') {
      var tbv = sl.tb && D.tiebreak && D.tiebreak.payload ? D.tiebreak.payload.value : null;
      var rows = LIVE ? WQD.table(LIVE, sl.upto, tbv) : [];
      return '<div class="info">' + (liveErr ? '<div class="warn">' + esc(liveErr) + '</div>' : '')
        + '<div class="row" style="display:flex;gap:8px"><button class="btn" data-live="1">↻ Aktualisieren</button>'
        + '<a class="btn" href="live.html#punkte" target="_blank">Punkte eintragen</a></div>'
        + rows.map(function (r) { return '<div>' + r.rank + '. ' + esc(r.name) + ' — <b>' + r.total + '</b>'
          + (r.per[sl.upto] == null ? ' <span class="mute">(Runde fehlt)</span>' : '') + '</div>'; }).join('')
        + '</div>';
    }
    if (!sl.q) {
      if (sl.k === 'round' || sl.k === 'solve') return '<div class="info"><div class="mute">' + sl.r.questions.length + ' Fragen</div>'
        + sl.r.questions.map(function (q, i) { return '<div>' + (i + 1) + '. ' + esc(q.prompt.slice(0, 70)) + '… → <b>' + esc(q.answer) + '</b></div>'; }).join('') + '</div>';
      return '';
    }
    var q = sl.q;
    return '<div class="info"><div class="mute">' + esc(TYPE[q.type] || q.type) + ' · ' + q.pts + ' Punkte</div>'
      + '<div class="ans">' + esc(q.answer) + '</div>'
      + playerHtml(q)
      + (q.background ? '<div class="bg">' + esc(q.background) + '</div>' : '')
      + '</div>';
  }
  var drawnIdx = -1;
  function draw() {
    var sl = deck[idx], nx = deck[idx + 1];
    document.getElementById('pos').textContent = (idx + 1) + ' / ' + deck.length;
    document.getElementById('jump').value = idx;
    document.getElementById('prev-stage').innerHTML = render(sl, true);
    document.getElementById('next').textContent = nx ? label(nx) : '— Ende —';
    if (drawnIdx !== idx) { document.getElementById('info').innerHTML = infoHtml(sl); drawnIdx = idx; }
  }
  function control() {
    root.innerHTML = '<div class="ctl">'
      + '<div class="ctl-bar"><button class="btn" id="back">◀</button><span class="pos" id="pos"></span>'
      + '<button class="btn red big" id="fwd">Weiter ▶</button>'
      + '<select class="jump" id="jump">' + deck.map(function (sl, i) { return '<option value="' + i + '">' + esc((i + 1) + '. ' + label(sl)) + '</option>'; }).join('') + '</select>'
      + '<button class="btn" id="open">📽 Beamer-Fenster öffnen</button><a class="btn" href="./#abend">Backoffice</a>'
      + '<span class="hint">Pfeiltasten, Leertaste oder Präsenter-Klicker blättern.</span></div>'
      + '<div class="col"><h3>Jetzt am Beamer</h3><div class="stage" id="prev-stage"></div>'
      + '<h3>Als Nächstes</h3><div class="next" id="next"></div></div>'
      + '<div class="col"><h3>Für dich</h3><div id="info"></div></div></div>';
    document.getElementById('back').onclick = function () { go(idx - 1); };
    document.getElementById('fwd').onclick = function () { go(idx + 1); };
    document.getElementById('jump').onchange = function () { go(Number(this.value)); };
    document.getElementById('open').onclick = function () { window.open('beamer.html#screen', 'wqscreen', 'popup,width=1280,height=720'); };
    document.getElementById('info').addEventListener('click', function (e) {
      if (e.target.closest('[data-live]')) { fetchLive(); return; }
      var b = e.target.closest('[data-media]');
      if (b) ch.postMessage({ t: 'media', cmd: b.getAttribute('data-media') });
    });
    document.addEventListener('keydown', function (e) {
      if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (['ArrowRight', 'PageDown', ' '].indexOf(e.key) >= 0) { e.preventDefault(); go(idx + 1); }
      if (['ArrowLeft', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); go(idx - 1); }
    });
    ch.onmessage = function (e) { if (e.data.t === 'hello') broadcast(true); };
    draw(); broadcast(true);
    fetchLive();
    setInterval(fetchLive, 30000);
  }

  if (SCREEN) { screen(); return; }
  WQD.load().then(function (data) {
    D = data; deck = buildDeck(D);
    try { idx = Math.min(deck.length - 1, Number(localStorage.getItem('wq-beamer-idx')) || 0); } catch (e) { idx = 0; }
    control();
  }).catch(function (e) { WQD.fail(e, root); });
})();
</script>
</body>
</html>
