<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beamer – Wirtshausquiz</title>
<link rel="icon" type="image/png" href="../logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patua+One&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  /* Zwei Fenster, eine Datei: beamer.html ist die Steuerung am Laptop,
     beamer.html#screen das Bild am Beamer. Die Steuerung lädt den Abend einmal
     und schickt ihn per BroadcastChannel ans Beamer-Fenster — danach braucht
     nur noch YouTube Internet. Hintergrundbilder je Frage liegen unter
     /uploads/bg/<frage-id>.jpg; fehlt eins, bleibt einfach das Holz. */
  :root { --red: #e51324; --yellow: #ffcc00; --green: #3aaa35; --cream: #f6efe2; --wood: #3f2c20; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 400 15px/1.45 Rubik, Arial, sans-serif; background: #17130f; color: var(--cream); }

  /* ---- Bühne: 16:9, alle Größen in cqw, damit Vorschau und Beamer gleich aussehen ---- */
  .stage { container-type: inline-size; aspect-ratio: 16 / 9; width: 100%; position: relative; overflow: hidden;
           background: radial-gradient(ellipse at 50% 35%, #5a4030 0%, #3f2c20 55%, #22170f 100%); color: var(--cream); }
  .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .7cqw; z-index: 3;
           background: linear-gradient(90deg, var(--red) 0 45%, var(--green) 45% 63%, var(--yellow) 63% 81%, #e6007e 81%); }
  .s-bg { position: absolute; inset: -4%; background: center / cover no-repeat; filter: blur(.28cqw) brightness(.68) saturate(1.2);
          opacity: .8; transform: scale(1.08); animation: drift 40s ease-in-out infinite alternate; }
  .s-shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(30,20,12,.3) 0%, rgba(20,13,8,.75) 100%); }
  .s-wrap { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; padding: 4cqw 5cqw; }
  .fx .s-bg.unblur { animation: unblur 1.8s ease-out both, drift 40s ease-in-out infinite alternate; }
  @keyframes unblur { from { filter: blur(var(--b0)) brightness(var(--l0)); opacity: var(--o0); } to { filter: blur(var(--b1)) brightness(var(--l1)); opacity: var(--o1); } }
  @keyframes drift { from { transform: scale(1.08) translate(0, 0); } to { transform: scale(1.18) translate(-2%, -1.5%); } }

  .s-top { display: flex; justify-content: space-between; align-items: center; font: 600 1.5cqw/1 Rubik, sans-serif;
           text-transform: uppercase; letter-spacing: .15cqw; opacity: .8; }
  .s-top img { height: 3.4cqw; }
  .s-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 1.6cqw; }
  .s-big { font: 400 8cqw/1 'Patua One', Georgia, serif; color: var(--cream); text-shadow: 0 .4cqw 2cqw rgba(0,0,0,.45); }
  .s-big.red { color: #ff4a57; }
  .s-huge { font: 400 22cqw/.9 'Patua One', Georgia, serif; color: #ff4a57; text-shadow: 0 1cqw 4cqw rgba(0,0,0,.5); }
  .s-sub { font: 500 2.4cqw/1.3 Rubik, sans-serif; opacity: .9; }
  .s-logo { height: 10cqw; }
  .s-q { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 2.2cqw; }
  .s-prompt { font: 500 3.4cqw/1.32 Rubik, sans-serif; text-shadow: 0 .2cqw 1cqw rgba(0,0,0,.5); }
  .s-prompt.m { font-size: 2.8cqw; } .s-prompt.l { font-size: 2.3cqw; }
  .s-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw 2cqw; }
  .s-opts div { background: rgba(246,239,226,.12); border: .15cqw solid rgba(246,239,226,.28); border-radius: 1cqw;
                padding: 1cqw 1.6cqw; font: 500 2.3cqw/1.25 Rubik, sans-serif; display: flex; gap: 1.2cqw; align-items: center;
                backdrop-filter: blur(.4cqw); }
  .s-opts b { font: 400 2.8cqw/1 'Patua One', serif; color: var(--yellow); }
  .s-opts div.ok { background: var(--green); border-color: var(--green); color: #fff; }
  .s-opts div.ok b { color: #fff; }
  .s-opts div.dim { opacity: .3; }
  .s-tag { align-self: flex-start; background: var(--yellow); color: #3a2a00; font: 700 1.6cqw/1 Rubik, sans-serif;
           padding: .7cqw 1.4cqw; border-radius: 99cqw; }
  .s-ans { align-self: flex-start; background: var(--green); color: #fff; border-radius: 1.2cqw; padding: 1.6cqw 2.4cqw;
           font: 400 4cqw/1.15 'Patua One', Georgia, serif; box-shadow: 0 1cqw 3cqw rgba(0,0,0,.4); }
  .s-ans em { display: block; font: 500 1.7cqw/1.3 Rubik, sans-serif; font-style: normal; opacity: .9; margin-top: .8cqw; }
  .s-ans small { display: block; font: 600 1.4cqw/1 Rubik, sans-serif; text-transform: uppercase; letter-spacing: .15cqw; opacity: .85; margin-bottom: .8cqw; }
  .s-media { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .s-media > * { height: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 0; border-radius: 1cqw; background: #000; }
  .s-media .ph { display: grid; place-items: center; font: 500 2cqw Rubik, sans-serif; color: #aaa; }
  .s-media img { object-fit: contain; background: transparent; aspect-ratio: auto; }
  .s-note { display: flex; align-items: center; gap: 1.5cqw; font: 500 2.4cqw Rubik, sans-serif; }
  .s-note i { font-style: normal; font-size: 4cqw; }
  .s-stand { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2cqw; justify-content: center; }
  .s-teams { list-style: none; display: flex; flex-wrap: wrap; gap: 1.2cqw; justify-content: center; }
  .s-teams li { background: rgba(246,239,226,.12); border: .15cqw solid rgba(246,239,226,.28); border-radius: 1cqw;
                padding: 1cqw 2cqw; font: 400 2.8cqw/1.15 'Patua One', serif; text-align: center; }
  .s-teams small { display: block; font: 600 1.3cqw/1.3 Rubik, sans-serif; color: var(--yellow); }
  .s-list { list-style: none; display: flex; flex-direction: column; gap: 1.5cqw; width: 82%; margin: 0 auto; }
  .s-list.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw 3cqw; width: 100%; }
  .s-list.grid li { align-items: flex-start; font-size: 1.75cqw; }
  .s-list.grid li > span { font-size: 3cqw; width: 4cqw; }
  .s-list.grid b { font-size: 2.3cqw; margin-bottom: .3cqw; }
  .s-list li { display: flex; gap: 2cqw; align-items: center; font: 400 2cqw/1.35 Rubik, sans-serif; }
  .s-list li > span { font-size: 3.6cqw; width: 5cqw; text-align: center; }
  .s-list b { display: block; font: 400 2.7cqw/1.15 'Patua One', serif; color: var(--yellow); }
  .s-hints { list-style: none; display: flex; flex-direction: column; gap: .9cqw; }
  .s-hints li { display: flex; gap: 1.5cqw; align-items: baseline; font: 500 2.3cqw/1.3 Rubik, sans-serif; opacity: .6; }
  .s-hints li.new { opacity: 1; font-size: 2.7cqw; }
  .s-hints li b { font: 400 2.6cqw/1 'Patua One', serif; color: var(--yellow); min-width: 2.5cqw; }
  .s-crown { align-self: flex-start; background: var(--yellow); color: #3a2a00; border-radius: 1.2cqw; padding: 1.2cqw 2.4cqw;
             font: 500 2.1cqw/1.25 Rubik, sans-serif; box-shadow: 0 0 3cqw rgba(255,204,0,.45); }
  .s-crown b { font: 400 3.6cqw/1.1 'Patua One', serif; text-transform: uppercase; letter-spacing: .15cqw; margin-left: .6cqw; }
  .s-crown small { display: block; font: 600 1.4cqw Rubik, sans-serif; opacity: .8; margin-top: .4cqw; }
  .fx .s-crown { animation: pop .7s cubic-bezier(.2,1.4,.4,1) both, glow 2.4s 2.6s ease-in-out infinite; animation-delay: var(--d, .1s), calc(var(--d, .1s) + .8s); }
  @keyframes glow { 50% { box-shadow: 0 0 5cqw rgba(255,204,0,.8); } }
  .s-tafel { display: flex; flex-wrap: wrap; gap: 1cqw; align-items: center; font: 600 1.5cqw Rubik, sans-serif; text-transform: uppercase; letter-spacing: .12cqw; color: var(--yellow); }
  .s-tafel b { font: 400 2.4cqw/1 'Patua One', serif; text-transform: none; letter-spacing: 0; color: #3a2a00; background: var(--yellow); border-radius: 99cqw; padding: .6cqw 1.6cqw; }
  .s-ladder { align-self: flex-start; background: var(--red); color: #fff; border-radius: 99cqw; padding: 1cqw 2.4cqw; font: 500 2.2cqw Rubik, sans-serif; }
  .s-rows { list-style: none; display: grid; gap: .8cqw 3cqw; width: 70%; margin: 0 auto; }
  .s-rows.two { grid-template-columns: 1fr 1fr; grid-auto-flow: column; width: 100%; }
  .s-rows li { display: flex; align-items: center; gap: 1.4cqw; background: rgba(246,239,226,.1); border-radius: 1cqw;
               padding: .7cqw 1.4cqw; font: 500 2.3cqw/1.2 Rubik, sans-serif; }
  .s-rows li b { font: 400 2.6cqw/1 'Patua One', serif; min-width: 3cqw; color: var(--yellow); }
  .s-rows li span { flex: 1; }
  .s-rows li i { font: 400 2.8cqw/1 'Patua One', serif; font-style: normal; }
  .s-rows li.p1 { background: var(--yellow); color: #3a2a00; } .s-rows li.p1 b { color: #3a2a00; }
  .s-rows li.p2 { background: rgba(246,239,226,.3); } .s-rows li.p3 { background: rgba(205,127,50,.5); }
  .fx .s-rows li[data-step] { opacity: 0; transform: translateY(2cqw) scale(.96); transition: opacity .5s, transform .6s cubic-bezier(.2,1.3,.4,1); }
  .fx .s-rows li[data-step].on { opacity: 1; transform: none; }
  .fx .s-rows li.p1.on { animation: okFlash 1.4s .3s both; box-shadow: 0 0 4cqw rgba(255,204,0,.6); }
  .s-timer { position: relative; width: 26cqw; aspect-ratio: 1; }
  .s-timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .s-timer circle { fill: none; stroke-width: 6; }
  .s-timer .track { stroke: rgba(246,239,226,.15); }
  .s-timer .bar { stroke: var(--yellow); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
  .s-timer .t { position: absolute; inset: 0; display: grid; place-items: center; font: 400 6.5cqw/1 'Patua One', serif; }
  .s-timer.done .t { color: var(--yellow); animation: pulse 1.2s ease-in-out infinite; font-size: 3.6cqw; text-align: center; }

  /* ---- Animationen: nur am Beamer (.fx), die Vorschau zeigt den Endzustand ---- */
  .fx .s-wrap { animation: wrapIn .6s ease-out both; }
  .fx .w { display: inline-block; opacity: 0; animation: wordIn .5s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i) * var(--wd, 40ms)); }
  .fx .pop { animation: pop .7s cubic-bezier(.2,1.4,.4,1) both; animation-delay: var(--d, .1s); }
  .fx .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
  .fx .zoom { animation: zoom .9s cubic-bezier(.2,1.2,.3,1) both; }
  .fx .s-opts div { opacity: 0; transform: translateY(1.5cqw) scale(.97); transition: opacity .45s, transform .45s cubic-bezier(.2,1.3,.4,1), background .4s; }
  .fx .s-opts div.on, .s-opts.all div { opacity: 1; transform: none; }
  .fx .s-opts div.ok { animation: okFlash 1s .6s both; }
  .fx .s-opts div.dim { transition-delay: .5s; }
  @keyframes wrapIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wordIn { from { opacity: 0; transform: translateY(.8cqw); filter: blur(.3cqw); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(3cqw); } to { opacity: 1; transform: none; } }
  @keyframes zoom { from { opacity: 0; transform: scale(2.2); filter: blur(1cqw); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes okFlash { 0% { box-shadow: 0 0 0 0 rgba(58,170,53,.9); transform: scale(1); } 40% { transform: scale(1.06); } 100% { box-shadow: 0 0 0 2.5cqw rgba(58,170,53,0); transform: scale(1); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .nofx * { animation: none !important; transition: none !important; }
  .skip .w { animation: none !important; opacity: 1 !important; }

  /* ---- Beamer-Fenster ---- */
  body.screen { background: #000; display: grid; place-items: center; overflow: hidden; cursor: none; }
  body.screen .stage { width: min(100vw, calc(100vh * 16 / 9)); }
  .start { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; text-align: center;
           font: 500 22px/1.5 Rubik, sans-serif; cursor: pointer; z-index: 5; }
  .start b { display: block; font: 400 40px 'Patua One', serif; color: var(--yellow); }

  /* ---- Steuerung ---- */
  .ctl { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 18px; padding: 14px 18px; max-width: 1500px; margin: 0 auto; }
  .ctl-bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { font: 600 15px Rubik, sans-serif; color: var(--cream); background: #3a332b; border: 1px solid #5a5047;
         border-radius: 99px; padding: 9px 18px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--yellow); }
  .btn.red { background: var(--red); border-color: var(--red); }
  .btn.big { font-size: 18px; padding: 12px 26px; }
  .pos { font: 400 22px 'Patua One', serif; min-width: 90px; text-align: center; }
  select.jump { font: 15px Rubik, sans-serif; padding: 8px; border-radius: 8px; max-width: 340px; }
  .pmin { font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .pmin input { width: 3.4em; font: 600 15px Rubik, sans-serif; padding: 6px; border-radius: 8px; border: 0; text-align: center; }
  .hint { font-size: 13px; opacity: .65; }
  .col h3 { font: 600 12px Rubik, sans-serif; text-transform: uppercase; letter-spacing: .12em; opacity: .6; margin: 14px 0 6px; }
  .col h3:first-child { margin-top: 0; }
  .next { opacity: .8; }
  .info { background: #241e19; border: 1px solid #3a332b; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .info .ans { font: 400 22px/1.2 'Patua One', serif; color: #7fd47a; }
  .info .bg { font-size: 15px; line-height: 1.5; }
  .info .mute { opacity: .6; font-size: 13px; }
  .player .row, .info .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .player .yt { width: 100%; max-width: 360px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; }
  .player .yt iframe { width: 100%; height: 100%; border: 0; }
  .player audio { width: 100%; }
  .warn { background: #5a1d1d; border-radius: 8px; padding: 8px 12px; }
  .cl-head { font-weight: 600; } .cl-head.ok { color: #7fd47a; }
  .cl { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .cl li { display: flex; gap: 6px; align-items: center; opacity: .75; } .cl li.ok { opacity: 1; }
  .cl li b { margin-left: auto; color: #7fd47a; }
  .sw { font: 600 18px Rubik, sans-serif; padding: 6px 12px; border-radius: 99px; background: #2b2520; min-width: 86px; text-align: center; }
  .sw.warm { background: #6b5200; } .sw.hot { background: #8a1a1a; }
  .rt { font: 500 14px Rubik, sans-serif; padding: 6px 12px; border-radius: 99px; background: #2b2520; }
  .rt.late { background: #6b5200; }
  .check { background: #5a4a10; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  a { color: var(--yellow); }
  @media (max-width: 900px) { .ctl { grid-template-columns: 1fr; } }
</style>

<script src="assets/quiz-data.js?v=6"></script>
<script>
(function () {
  'use strict';
  var esc = WQD.esc, TYPE = WQD.TYPE;
  var SCREEN = location.hash === '#screen';
  // Beim Deploy hochzählen: ein noch offenes Beamer-Fenster mit altem Code lädt sich dann selbst neu.
  var BUILD = '20261008-8';
  function buildNum(b) { var m = String(b || '').split('-'); return Number(m[0] || 0) * 1000 + Number(m[1] || 0); }
  // Jede Steuerung hat eine Kennung; das Beamer-Fenster folgt nur der zuletzt geöffneten.
  var CTRL = { id: Math.random().toString(36).slice(2), t: Date.now() };
  var ch = new BroadcastChannel('wq-beamer');
  var root = document.getElementById('root');
  var D = null, deck = [], idx = 0, step = 0, LIVE = null, RESUME = 0;
  var PAUSE_MIN = 10, TIMER = null; // TIMER: {idx, total, ends, left, running}
  try { PAUSE_MIN = Number(localStorage.getItem('wq-pause-min')) || 10; } catch (e) {}

  // ---- Ablauf: aus dem Abend wird eine flache Folienliste --------------------
  // Pro Runde: Rundentitel → Fragen → Zettel nach vorne → Pause (Timer, wir werten
  // aus) → Auflösung mit Antworten → Zwischenstand. Multiple Choice hat Klickschritte:
  // jeder Klick blendet eine Antwortmöglichkeit ein.
  function nOpts(q) { return q.type === 'MULTIPLE_CHOICE' ? ((q.payload && q.payload.options) || []).length : 0; }
  function buildDeck(D) {
    var s = [{ k: 'title' }, { k: 'teams' }, { k: 'rules' }, { k: 'prizes' }];
    D.rounds.filter(function (r) { return r.questions.length; }).forEach(function (r) {
      s.push({ k: 'round', r: r });
      if (r.kind !== 'HANDOUT') {
        r.questions.forEach(function (q, i) { s.push({ k: 'q', r: r, i: i, q: q, steps: nOpts(q) }); });
        s.push({ k: 'collect', r: r });
      }
      s.push({ k: 'pause', r: r, min: r.n === 1 ? 5 : 10 }); // nach Runde 1 nur auswerten, später auch Durchschnaufen
      s.push({ k: 'solve', r: r });
      r.questions.forEach(function (q, i) { s.push({ k: 'a', r: r, i: i, q: q }); });
      s.push({ k: 'stand', upto: r.n - 1, r: r });
    });
    var mh = D.master && D.master.payload && D.master.payload.hints;
    if (D.master) s.push({ k: 'minfo' });
    if (mh && mh.length) {
      mh.forEach(function (h, i) { s.push({ k: 'mhint', n: i + 1, q: D.master, label: 'Masterfrage' }); });
      s.push({ k: 'a', label: 'Masterfrage', q: D.master });
    } else if (D.master) {
      s.push({ k: 'q', label: 'Masterfrage', q: D.master, steps: nOpts(D.master) }, { k: 'a', label: 'Masterfrage', q: D.master });
    }
    var last = D.rounds.length - 1 + (D.master ? 1 : 0);
    if (D.master) s.push({ k: 'pause', master: true, min: 5 });
    s.push({ k: 'stand', upto: last, final: true });
    if (D.tiebreak) {
      s.push({ k: 'q', label: 'Stechfrage', q: D.tiebreak, steps: 0 }, { k: 'a', label: 'Stechfrage', q: D.tiebreak });
      s.push({ k: 'stand', upto: last, final: true, tb: true });
    }
    s.push({ k: 'end' });
    return s;
  }
  function label(sl) {
    switch (sl.k) {
      case 'title': return 'Begrüßung';
      case 'teams': return 'Die Teams';
      case 'rules': return 'Regeln';
      case 'prizes': return 'Finale & Preise';
      case 'pause': return sl.master ? 'Pause: Masterpunkte eintragen' : 'R' + sl.r.n + ' · Pause (Timer)';
      case 'mhint': return 'Masterfrage · Hinweis ' + sl.n;
      case 'minfo': return 'Finale: So geht die Masterfrage';
      case 'round': return 'Runde ' + sl.r.n + ': ' + sl.r.title;
      case 'q': return (sl.label || 'R' + sl.r.n + ' · Frage ' + (sl.i + 1)) + ' — ' + sl.q.prompt.slice(0, 60);
      case 'collect': return 'R' + sl.r.n + ' · Zettel nach vorne';
      case 'solve': return 'R' + sl.r.n + ' · Auflösung';
      case 'stand': return sl.tb ? 'Endstand nach Stechfrage' : sl.final ? 'Endstand' : 'Zwischenstand nach Runde ' + sl.r.n;
      case 'a': return (sl.label ? sl.label + ' · Antwort' : 'R' + sl.r.n + ' · Antwort ' + (sl.i + 1)) + ' — ' + sl.q.answer;
      default: return 'Schluss';
    }
  }

  // ---- Folien zeichnen (Beamer und Vorschau teilen sich das) ---------------
  // Während der Masterhinweise kein Fragenbild – das würde die Lösung verraten; erst die Auflösung zeigt es.
  // Masterhinweise: eigenes Bild <id>_hint.jpg (Cocktail), wird von Hinweis zu Hinweis schärfer.
  var UNBLUR = [[3.2, .5, .7], [2.4, .55, .74], [1.5, .6, .78], [.3, .72, .9], [0, .78, .95]]; // [blur cqw, Helligkeit, Deckkraft]
  function unblurAt(n) { return UNBLUR[Math.max(0, Math.min(UNBLUR.length - 1, n - 1))]; }
  function bgStyle(sl) {
    var url = sl.k === 'mhint' ? '../uploads/bg/' + encodeURIComponent(sl.q.id) + '_hint.jpg' : bgUrl(sl);
    var st = "background-image:url('" + url + "')";

    var out = [{ key: 'intro', label: 'Begrüßung', min: 8 }];
    deck.forEach(function (sl) {
      if (sl.k === 'round') out.push({ key: 'r' + sl.r.n, label: 'Runde ' + sl.r.n, min: planRound(sl.r, sl.r.n === 1 ? 5 : 10) });
    });
    if (D.master) out.push({ key: 'fin', label: 'Finale', min: 12 + 5 + 10 });
    return out;
  }
  function segOf(i) {
    for (var j = i; j >= 0; j--) {
      var k = deck[j].k;
      if (k === 'round') return 'r' + deck[j].r.n;
      if (k === 'minfo' || k === 'mhint') return 'fin';
    }
    return 'intro';
  }
  function fmtClock(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function drawClock() {
    var el = document.getElementById('rt'); if (!el) return;
    var ps = plans(), cur = segOf(idx), ci = ps.map(function (x) { return x.key; }).indexOf(cur);
    if (!segStart[cur]) segStart[cur] = Date.now();
    var el2 = (Date.now() - segStart[cur]) / 60000, seg = ps[ci] || ps[0];
    var rest = Math.max(0, seg.min - el2);
    for (var i = ci + 1; i < ps.length; i++) rest += ps[i].min;
    var s = Math.floor(el2 * 60);
    el.textContent = seg.label + ' ' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2) + ' / ~' + Math.round(seg.min) + ' min · Ende ca. ' + fmtClock(new Date(Date.now() + rest * 60000));
    el.className = 'rt' + (el2 > seg.min + 5 ? ' late' : '');
  }
  function typingMs(sl) {
    if (sl.k === 'q') return nWords(sl.q.prompt) * WORD_MS + 500;
    if (sl.k === 'mhint') return nWords((sl.q.payload.hints || [])[sl.n - 1]) * WORD_MS + 500;
    return 0;
  }
  function moved() {
    try { localStorage.setItem('wq-beamer-idx', idx); } catch (e) {}
    typeEnd = Date.now() + typingMs(deck[idx]);
    qStart = deck[idx].k === 'q' || deck[idx].k === 'mhint' ? Date.now() : 0;
    // Pause-Folie: Timer startet beim Hinkommen von selbst (einmal je Pause).
    if (deck[idx].k === 'pause' && (!TIMER || TIMER.idx !== idx)) startTimer(deck[idx].min);
    broadcast(false); draw();
    if (needsLive(deck[idx])) fetchLive();
  }
  function goto(n) { idx = Math.max(0, Math.min(deck.length - 1, n)); step = 0; moved(); }
  function forward() {
    if (Date.now() < typeEnd) { typeEnd = 0; ch.postMessage({ t: 'skip', ctrl: CTRL }); return; }
    if (step < stepsOf(deck[idx])) { step++; broadcast(false); draw(); return; }
    if (idx < deck.length - 1) goto(idx + 1);
  }
  function backward() {
    if (step > 0) { step--; broadcast(false); draw(); return; }
    if (idx > 0) { idx--; step = stepsOf(deck[idx]); moved(); }
  }
  function startTimer(min) { min = min || PAUSE_MIN; TIMER = { idx: idx, total: min * 60000, ends: Date.now() + min * 60000, left: 0, running: true }; }
  function timerCmd(c) {
    if (/^set:\d+$/.test(c)) { startTimer(Number(c.slice(4))); }
    else if (c === 'restart' || !TIMER) { startTimer(deck[idx].min); }
    else if (c === 'toggle') {
      if (TIMER.running) { TIMER.left = TIMER.ends - Date.now(); TIMER.running = false; }
      else { TIMER.ends = Date.now() + TIMER.left; TIMER.running = true; }
    } else {
      var d = c === 'plus' ? 60000 : -60000;
      if (TIMER.running) TIMER.ends += d; else TIMER.left += d;
      TIMER.total = Math.max(TIMER.total, timeLeft());
    }
    broadcast(false); drawnIdx = -1; draw(); tick();
  }
  function needsLive(sl) { return sl.k === 'stand' || sl.k === 'teams'; }
  // Holt die Punkte und hält nebenbei die Backoffice-Anmeldung wach (alle 30 s).
  var liveErr = '';
  function fetchLive() {
    return WQD.api('live.php').then(function (d) {
      LIVE = d; liveErr = '';
    }, function (e) {
      liveErr = e.status === 401 ? 'Abgemeldet — im Backoffice neu anmelden, dann hier „Aktualisieren“.' : 'Punkte nicht erreichbar (' + e.message + ')';
    }).then(function () {
      broadcast(false);
      if (needsLive(deck[idx]) || deck[idx].k === 'pause') { drawnIdx = -1; draw(); }
    });
  }
  function fmtTime(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }

  // Ton läuft am Laptop: ein eigener YouTube-Player im Steuerfenster, bedient über
  // dieselben Knöpfe wie das Video am Beamer.
  var aPlayer = null, aEl = null;
  function playerHtml(q, sl) {
    var m = q.media;
    if (!m) return '';
    var when = (m.start ? ' ab ' + fmtTime(m.start) : '') + (m.end ? ' bis ' + fmtTime(m.end) : '');
    if (m.kind === 'missing') return '<div class="warn">Clip fehlt noch.' + (m.search
      ? ' <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(m.search) + '">Auf YouTube suchen</a> und im Backoffice bei der Frage eintragen.' : '') + '</div>';
    if (m.video && sl.k !== 'q') return '';
    var btns = '<div class="row"><button class="btn red big" data-media="play">▶ Abspielen</button><button class="btn" data-media="pause">⏸ Pause</button>'
      + '<button class="btn" data-media="restart">⟲ Von vorn</button></div>';
    if (m.video) return '<div class="player"><div class="mute">🎬 Video läuft am Beamer' + when + '</div>' + btns + '</div>';
    return '<div class="player"><div class="mute">🎵 Ton kommt aus dem Laptop' + when + '</div>' + btns
      + (m.kind === 'youtube'
        ? '<div class="yt"><div id="aplayer"></div></div><a class="mute" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=' + m.id + (m.start ? '&t=' + Math.floor(m.start) : '') + '">Notfall: auf YouTube öffnen</a>'
        : '<audio id="afile" preload="auto" controls src="' + esc(m.src) + '"></audio>') + '</div>';
  }
  function mountAudio(sl) {
    aPlayer = null; aEl = null;
    var m = sl.q && sl.q.media;
    if (!m || m.video) return;
    if (m.kind === 'file') { aEl = document.getElementById('afile'); if (aEl) aEl.addEventListener('loadedmetadata', function () { aEl.currentTime = m.start || 0; }); return; }
    if (m.kind !== 'youtube' || !document.getElementById('aplayer')) return;
    if (!ytReady) { pendingMount = sl; return; }
    aPlayer = new YT.Player('aplayer', {
      host: 'https://www.youtube-nocookie.com', videoId: m.id,
      playerVars: { start: Math.floor(m.start || 0), rel: 0, playsinline: 1, modestbranding: 1 }
    });
  }
  // Wer hat für diese Runde schon Punkte? Aktualisiert sich alle 5 s von selbst.
  function checklist(ri) {
    if (!LIVE) return '<div class="mute">Punkte werden geladen …</div>';
    var anyIn = Object.keys(LIVE.checkin).length > 0;
    var ts = LIVE.teams.filter(function (t) { return !anyIn || LIVE.checkin[t.id]; });
    var have = ts.filter(function (t) { return ((LIVE.scores[t.id] || {})[ri]) != null; }).length;
    return '<a class="btn red big" href="live.html?r=' + ri + '#punkte" target="_blank">✍️ Punkte eintragen (' + (ri >= D.rounds.length ? 'Masterfrage' : 'Runde ' + (ri + 1)) + ')</a>'
      + '<div class="cl-head' + (have === ts.length ? ' ok' : '') + '">' + (have === ts.length ? '✓ Alle ' + ts.length + ' Teams eingetragen — bereit für die Auflösung'
        : have + ' von ' + ts.length + ' Teams eingetragen') + '</div>'
      + '<ul class="cl">' + ts.map(function (t) {
        var v = (LIVE.scores[t.id] || {})[ri];
        return '<li class="' + (v != null ? 'ok' : '') + '"><span>' + (v != null ? '✅' : '⭕') + '</span>' + esc(t.name) + (v != null ? '<b>' + v + '</b>' : '') + '</li>';
      }).join('') + '</ul>' + (liveErr ? '<div class="warn">' + esc(liveErr) + '</div>' : '');
  }
  function clueHtml(sl) {
    var q = sl.q;
    if (sl.k !== 'a' || !q.masterClue || !q.clueNote) return '';
    return '<div class="check">👑 Jetzt Masterhinweis ansagen: <b>' + esc(q.clueNote) + '</b> – „Schreibt’s euch auf eure Masterkarte!“ (Banner kommt nach der Antwort)</div>';
  }
  function checkHtml(q) {
    return (q.tags || []).indexOf('prüfen') >= 0 ? '<div class="check">⚠ Bitte prüfen: ' + esc(String(q.factCheck || '').replace(/^⚠ Claude:\s*/, '')) + '</div>' : '';
  }
  function infoHtml(sl) {
    if (sl.k === 'pause') {
      return '<div class="info"><div class="mute">Pause-Timer — startet von selbst, läuft am Beamer mit.</div><div class="row">'
        + '<button class="btn red" data-timer="toggle">' + (TIMER && TIMER.running ? '⏸ Anhalten' : '▶ Weiter') + '</button>'
        + '<button class="btn" data-timer="minus">− 1 min</button><button class="btn" data-timer="plus">+ 1 min</button>'
        + '<button class="btn" data-timer="restart">⟲ Neu</button></div>'
        + '<div class="row"><span class="mute" style="align-self:center">Diese Pause neu starten mit:</span>'
        + [5, 10, 15, 20].map(function (m) { return '<button class="btn" data-timer="set:' + m + '">' + m + ' min</button>'; }).join('') + '</div>'
        + checklist(sl.master ? D.rounds.length : sl.r.n - 1) + '</div>';
    }
    if (sl.k === 'mhint') {
      var mp = sl.q.payload || {};
      return '<div class="info"><div class="mute">Hinweis ' + sl.n + ' von ' + (mp.hints || []).length + ' — jetzt ' + ((mp.ladder || [])[sl.n - 1] || '') + ' Punkte</div>'
        + '<div class="ans">' + esc(sl.q.answer) + '</div>'
        + '<div class="mute">Helfer sammelt die hochgehaltenen Karten ein und schreibt „' + sl.n + '“ drauf.</div>'
        + (mp.clueExplanation ? '<div class="bg">' + esc(mp.clueExplanation) + '</div>' : '') + '</div>';
    }
    if (sl.k === 'teams') {
      return '<div class="info"><div class="row"><button class="btn" data-live="1">↻ Aktualisieren</button>'
        + '<a class="btn" href="live.html#checkin" target="_blank">Check-in</a></div>'
        + '<div class="mute">Zeigt die eingecheckten Teams (oder alle, solange noch niemand eingecheckt ist).</div></div>';
    }
    if (sl.k === 'stand') {
      var tbv = sl.tb && D.tiebreak && D.tiebreak.payload ? D.tiebreak.payload.value : null;
      var rows = LIVE ? WQD.table(LIVE, sl.upto, tbv) : [];
      return '<div class="info">' + (liveErr ? '<div class="warn">' + esc(liveErr) + '</div>' : '')
        + '<div class="row"><button class="btn" data-live="1">↻ Aktualisieren</button>'
        + '<a class="btn" href="live.html#punkte" target="_blank">Punkte eintragen</a></div>'
        + (function () {
          var miss = rows.filter(function (r) { return r.per[sl.upto] == null; }).map(function (r) { return r.name; });
          return miss.length ? '<div class="warn">⚠ ' + (sl.final ? 'Es fehlen noch Punkte von' : 'Runde ' + (sl.upto + 1) + ' fehlt noch bei')
            + ': ' + esc(miss.join(', ')) + '</div>' : '<div class="mute">✓ Alle Teams eingetragen</div>';
        })()
        + rows.map(function (r) { return '<div>' + r.rank + '. ' + esc(r.name) + ' — <b>' + r.total + '</b></div>'; }).join('')
        + '</div>';
    }
    if (!sl.q) {
      if (sl.k === 'round' || sl.k === 'solve') return '<div class="info"><div class="mute">' + sl.r.questions.length + ' Fragen</div>'
        + sl.r.questions.map(function (q, i) { return '<div>' + (i + 1) + '. ' + esc(q.prompt.slice(0, 70)) + '… → <b>' + esc(q.answer) + '</b></div>'; }).join('') + '</div>';
      return '';
    }
    var q = sl.q;
    return '<div class="info"><div class="mute">' + esc(TYPE[q.type] || q.type) + ' · ' + q.pts + ' Punkte'
      + (sl.steps ? ' · Klick blendet die Antworten einzeln ein' : '') + '</div>'
      + clueHtml(sl) + checkHtml(q)
      + '<div class="ans">' + esc(q.answer) + '</div>'
      + playerHtml(q, sl)
      + (q.background ? '<div class="bg">' + esc(q.background) + '</div>' : '')
      + '</div>';
  }
  var drawnIdx = -1;
  function draw() {
    var sl = deck[idx], nx = deck[idx + 1];
    document.getElementById('pos').textContent = (idx + 1) + ' / ' + deck.length;
    document.getElementById('jump').value = idx;
    document.getElementById('prev-stage').innerHTML = render(sl, true, step);
    var ns = stepsOf(sl);
    document.getElementById('next').textContent = step < ns
      ? (sl.k === 'stand' ? 'Nächster Klick: Platz ' + (ns - step) + ' aufdecken' : 'Nächster Klick: Antwort ' + 'ABCDEFGH'[step] + ' einblenden')
      : nx ? label(nx) : '— Ende —';
    if (drawnIdx !== idx) { document.getElementById('info').innerHTML = infoHtml(sl); drawnIdx = idx; mountAudio(sl); }
    tick();
  }
  function control() {
    root.innerHTML = '<div class="ctl"><div class="warn" id="stale" hidden style="grid-column:1/-1;font-size:16px">⚠ Es ist ein neueres Steuerfenster offen – dieses hier steuert den Beamer nicht mehr. Bitte dieses Fenster schließen.</div>'
      + '<div class="ctl-bar"><button class="btn" id="back">◀</button><span class="pos" id="pos"></span><span class="sw" id="sw" hidden></span>'
      + '<button class="btn red big" id="fwd">Weiter ▶</button>'
      + '<select class="jump" id="jump">' + deck.map(function (sl, i) { return '<option value="' + i + '">' + esc((i + 1) + '. ' + label(sl)) + '</option>'; }).join('') + '</select>'
      + '<span class="rt" id="rt"></span>'
      + (RESUME > 0 ? '<button class="btn" id="resume">↪ Weiter bei Folie ' + (RESUME + 1) + '</button>' : '')
      + '<button class="btn" id="open">📽 Beamer-Fenster öffnen</button><a class="btn" href="./#abend">Backoffice</a>'
      + '<span class="hint">Pfeiltasten, Leertaste oder Präsenter-Klicker blättern.</span></div>'
      + '<div class="col"><h3>Jetzt am Beamer</h3><div class="stage nofx" id="prev-stage"></div>'
      + '<h3>Als Nächstes</h3><div class="next" id="next"></div></div>'
      + '<div class="col"><h3>Für dich</h3><div id="info"></div></div></div>';
    document.getElementById('back').onclick = backward;
    var rb = document.getElementById('resume');
    if (rb) rb.onclick = function () { rb.remove(); goto(RESUME); };
    document.getElementById('fwd').onclick = forward;
    document.getElementById('jump').onchange = function () { goto(Number(this.value)); };
    document.getElementById('open').onclick = function () { window.open('beamer.html?b=' + BUILD + '-' + Date.now() + '#screen', 'wqscreen', 'popup,width=1280,height=720'); };
    document.getElementById('info').addEventListener('click', function (e) {
      if (e.target.closest('[data-live]')) { fetchLive(); return; }
      var t = e.target.closest('[data-timer]');
      if (t) { timerCmd(t.getAttribute('data-timer')); return; }
      var b = e.target.closest('[data-media]');
      if (!b) return;
      var m = deck[idx].q && deck[idx].q.media, cmd = b.getAttribute('data-media');
      if (m && m.video) ch.postMessage({ t: 'media', cmd: cmd, ctrl: CTRL });
      else mediaCmd(cmd, aPlayer, aEl, m);
    });
    document.addEventListener('keydown', function (e) {
      if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (['ArrowRight', 'PageDown', ' '].indexOf(e.key) >= 0) { e.preventDefault(); forward(); }
      if (['ArrowLeft', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); backward(); }
    });
    ch.onmessage = function (e) {
      var d = e.data;
      if (d.t === 'hello') broadcast(true);
      if (d.ctrl && d.ctrl.id !== CTRL.id && d.ctrl.t > CTRL.t) document.getElementById('stale').hidden = false;
    };
    loadYT(function () { if (pendingMount && pendingMount === deck[idx]) mountAudio(pendingMount); });
    watchEnd(function () { return adapter(aPlayer, aEl); }, function () { var m = deck[idx].q && deck[idx].q.media; return m && !m.video ? m : null; });
    draw(); broadcast(true);
    fetchLive();
    // Pause und Zwischenstand: alle 5 s frisch, sonst alle 30 s (hält auch die Anmeldung wach).
    var ticks = 0;
    setInterval(function () {
      ticks++;
      var k = deck[idx].k;
      if (k === 'pause' || k === 'stand' || ticks % 6 === 0) fetchLive();
    }, 5000);
    // Rundenuhr: wie lange läuft die Runde schon, wie viel ist eingeplant, wann ist ungefähr Schluss?
    setInterval(drawClock, 1000); drawClock();
    // Stoppuhr je Frage, nur am Laptop: gelb ab 1:00, rot ab 1:30.
    setInterval(function () {
      var sw = document.getElementById('sw');
      if (!qStart) { sw.hidden = true; return; }
      var s = Math.floor((Date.now() - qStart) / 1000);
      sw.hidden = false; sw.textContent = '⏱ ' + Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
      sw.className = 'sw' + (s >= 90 ? ' hot' : s >= 60 ? ' warm' : '');
    }, 500);
  }

  if (SCREEN) { screen(); return; }
  WQD.load().then(function (data) {
    D = data; deck = buildDeck(D);
    // Immer bei Folie 1 anfangen; die zuletzt gezeigte Folie gibt's als Knopf (für Neuladen am Abend).
    try { RESUME = Math.min(deck.length - 1, Number(localStorage.getItem('wq-beamer-idx')) || 0); } catch (e) { RESUME = 0; }
    idx = 0;
    control();
  }).catch(function (e) { WQD.fail(e, root); });
})();
</script>
</body>
</html>
