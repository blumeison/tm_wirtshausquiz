<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="UTF-8">
<title>Anmeldung – bewegte Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patua+One&family=Rubik:wght@400;500;700&display=swap">
<style>
  /* Anmelde-Story als Video (1080x1920) — die zweite Seite hinter der
     bewegten Auflösung. Hier soll getippt werden, deshalb bleibt unten ein
     Feld für den Link-Sticker frei (go.team-michelhausen.at, wegen Tracking),
     und ein Pfeil zeigt darauf.

     Texte und Zahlen kommen als window.CFG aus build_video.py.
     Kein CSS-Timing: render(t) setzt jeden Zustand aus der Zeit t.

     CI (tm-design) auf der Kampagnen-Bildwelt (Bierdeckel auf Holz):
     Patua One + Rubik, Ink #3f3f3e, Rot als Signal, Gelb nur als Hinweis-
     Zeile, Flaggenbalken mit Rot vorne. Du-Form. */

  :root {
    --tm-red: #e51324; --tm-yellow: #ffcc00;
    --tm-ink: #3f3f3e; --tm-text-soft: #6b6b6a;
    --tm-font-head: 'Patua One', Georgia, serif;
    --tm-font-body: 'Rubik', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --tm-flag-gradient: linear-gradient(90deg, #e51324 0 45%, #3aaa35 45% 63.3%,
                                        #ffcc00 63.3% 81.6%, #e6007e 81.6% 100%);
    --board: #f0e8d8; --board-sh: #ddd2bc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }

  .stage { position: relative; overflow: hidden; width: 1080px; height: 1920px; background: #3f2c20; }
  .wood, .wood-photo, .vignette { position: absolute; inset: 0; }
  .wood {
    background:
      repeating-linear-gradient(91.5deg,
        rgba(0,0,0,.07) 0, rgba(0,0,0,.07) 3px,
        rgba(255,255,255,.014) 3px, rgba(255,255,255,.014) 9px,
        rgba(0,0,0,.035) 9px, rgba(0,0,0,.035) 23px),
      linear-gradient(163deg, #63483a 0%, #4a3527 48%, #33241a 100%);
  }
  .wood-photo { background-image: url("wood.jpg"); background-size: cover; background-position: center;
                filter: brightness(1.12) saturate(1.06); }
  .vignette { background: radial-gradient(ellipse at 50% 42%,
      rgba(255,232,190,.13) 0%, rgba(0,0,0,0) 52%, rgba(0,0,0,.38) 100%); }

  .mat { position: absolute; left: 70px; top: 240px; width: 940px; height: 1440px;
         background: var(--board); border-radius: 42px; text-align: center;
         box-shadow: 0 2px 0 var(--board-sh), 0 3px 1px rgba(0,0,0,.35), 0 26px 50px rgba(0,0,0,.55); }
  .mat::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
                 background-image: var(--noise); opacity: .5; mix-blend-mode: multiply; }
  .mat::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
                background: linear-gradient(145deg, rgba(255,255,255,.5), rgba(0,0,0,0) 38%, rgba(0,0,0,.06)); }
  .keyline { position: absolute; inset: 42px; border: 2px solid var(--tm-red); border-radius: 24px; opacity: .85; }
  .content { position: absolute; inset: 42px; z-index: 2; padding: 46px 48px 38px;
             display: flex; flex-direction: column; align-items: center; }

  .kicker { font: 500 32px var(--tm-font-body); letter-spacing: 4px; color: var(--tm-ink);
            text-transform: uppercase; }
  .h { margin-top: 14px; font: 400 104px/1.02 var(--tm-font-head); color: var(--tm-red); }
  .when { margin-top: 22px; font: 400 46px/1.2 var(--tm-font-head); color: var(--tm-ink); }
  .where { margin-top: 10px; font: 500 32px var(--tm-font-body); color: var(--tm-text-soft); }

  /* Ein Krug je angemeldetem Team — zeigt Zulauf, ohne eine Obergrenze zu
     behaupten. Für „Letzte Plätze“ später auf den Restplatz-Text umstellen. */
  .mugs { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
          max-width: 700px; }
  .mug { font-size: 56px; line-height: 1; }
  .teams { margin-top: 20px; font: 700 42px var(--tm-font-body); color: var(--tm-ink); }
  .hint { margin-top: 18px; display: inline-block; background: var(--tm-yellow); color: var(--tm-ink);
          font: 700 34px var(--tm-font-body); padding: 12px 28px; border-radius: 999px; }

  .tap { margin-top: 26px; font: 700 36px var(--tm-font-body); color: var(--tm-red); }
  .arrow { display: block; margin: 10px auto 0; }
  /* Freies Feld für den Link-Sticker — etwas größer als der Sticker selbst. */
  .zone { margin: 10px auto 0; width: 600px; height: 150px; border-radius: 30px;
          background: rgba(63,63,62,.07); }

  .foot { margin-top: auto; width: 100%; }
  .small { font: 400 27px var(--tm-font-body); color: var(--tm-text-soft); }
  .flagbar { width: 225px; height: 12px; margin: 18px auto 0; border-radius: 99px; background: var(--tm-flag-gradient); }
  .logo { display: block; height: 84px; margin: 16px auto 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="wood"></div>
  <div class="wood-photo"></div>
  <div class="vignette"></div>

  <div class="mat" id="mat">
    <div class="keyline"></div>
    <div class="content" id="content">
      <p class="kicker" id="kicker"></p>
      <h1 class="h" id="h"></h1>
      <p class="when" id="when"></p>
      <p class="where" id="where"></p>

      <div class="mugs" id="mugs"></div>
      <p class="teams" id="teams"></p>
      <p class="hint" id="hint"></p>

      <p class="tap" id="tap"></p>
      <svg class="arrow" id="arrow" width="54" height="52" viewBox="0 0 54 52">
        <path d="M27 4 V40 M13 27 L27 41 L41 27" fill="none" stroke="#e51324"
              stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="zone" id="zone"></div>

      <div class="foot" id="foot">
        <p class="small" id="small"></p>
        <div class="flagbar"></div>
        <img class="logo" src="logo-trim.png" alt="SPÖ &amp; Unabhängige – Team Michelhausen">
      </div>
    </div>
  </div>
</div>

<script>
var CFG = window.CFG;
function txt(id, s) { document.getElementById(id).textContent = s || ''; }
txt('kicker', CFG.kicker);
txt('h', CFG.headline);
txt('when', CFG.when);
txt('where', CFG.where);
txt('hint', CFG.hint);
txt('tap', CFG.tap);
txt('small', CFG.small);

// Ein Krug je angemeldetem Team.
var mugs = document.getElementById('mugs');
var mugEls = [];
for (var i = 0; i < CFG.teams; i++) {
  var m = document.createElement('span');
  m.className = 'mug';
  m.textContent = '🍺';
  mugs.appendChild(m);
  mugEls.push(m);
}

function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function span(t, a, b) { return clamp((t - a) / (b - a)); }
function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
function pop(p) {
  if (p <= 0) return 0;
  var c = 1.70158 * 1.4;
  return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
}
function show(id, p, dy) {
  var e = document.getElementById(id);
  e.style.opacity = p;
  e.style.transform = 'translateY(' + ((1 - p) * (dy || 22)) + 'px)';
}

window.DURATION = 9;

window.render = function (t) {
  var mp = easeOut(span(t, 0, .7));
  var mat = document.getElementById('mat');
  mat.style.opacity = mp;
  mat.style.transform = 'translateY(' + ((1 - mp) * 80) + 'px) rotate(' + (-1 + (1 - mp) * -2) + 'deg)';

  show('kicker', easeOut(span(t, .3, .9)));
  show('h', easeOut(span(t, .5, 1.2)));
  show('when', easeOut(span(t, .8, 1.5)));
  show('where', easeOut(span(t, .9, 1.6)));

  // Krüge stellen sich der Reihe nach dazu: 1,8 s bis 3,4 s
  mugEls.forEach(function (m, i) {
    var a = 1.8 + i * (1.6 / Math.max(1, mugEls.length));
    var p = pop(span(t, a, a + .45));
    m.style.opacity = p > 0 ? 1 : 0;
    m.style.transform = 'scale(' + p + ')';
  });
  var seen = 0;
  mugEls.forEach(function (m, i) {
    var a = 1.8 + i * (1.6 / Math.max(1, mugEls.length));
    if (t >= a + .45) seen++;
  });
  document.getElementById('teams').textContent =
    CFG.teamsText.replace('{n}', seen);
  show('teams', easeOut(span(t, 1.9, 2.4)));
  var hp = pop(span(t, 3.6, 4.1));
  var hint = document.getElementById('hint');
  hint.style.opacity = hp > 0 ? 1 : 0;
  hint.style.transform = 'scale(' + hp + ')';

  show('tap', easeOut(span(t, 4.4, 5.0)));
  document.getElementById('zone').style.opacity = easeOut(span(t, 4.4, 5.0));
  // Pfeil tippt im Sekundentakt Richtung Sticker-Feld.
  var nudge = t > 5.0 ? Math.pow(Math.max(0, Math.sin((t - 5.0) * Math.PI * 1.6)), 2) : 0;
  var arrow = document.getElementById('arrow');
  arrow.style.opacity = easeOut(span(t, 4.6, 5.2));
  arrow.style.transform = 'translateY(' + (nudge * 16) + 'px)';

  show('foot', easeOut(span(t, 5.2, 5.9)), 26);
};

window.overflow = function () {
  var c = document.getElementById('content');
  return c.scrollHeight - c.clientHeight;
};
window.render(window.DURATION);
</script>
</body>
</html>
