<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="UTF-8">
<title>Frage der Woche – Sujet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patua+One&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  /* „Frage der Woche" für Instagram und Facebook.
     Gleiche Bildwelt wie die übrigen Sujets — die Antwort steht bewusst
     NICHT drauf, die kommt am Folgetag als Kommentar. */

  :root {
    --red: #e51324; --green: #3aaa35; --yellow: #ffcc00; --magenta: #e6007e;
    --board: #f0e8d8; --board-sh: #ddd2bc; --ink: #4a4034;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }

  .stage { position: relative; overflow: hidden; display: grid; place-items: center;
           background: #3f2c20; }

  .wood, .wood-photo, .vignette { position: absolute; inset: 0; }
  .wood {
    background:
      repeating-linear-gradient(91.5deg,
        rgba(0,0,0,.07) 0, rgba(0,0,0,.07) 3px,
        rgba(255,255,255,.014) 3px, rgba(255,255,255,.014) 9px,
        rgba(0,0,0,.035) 9px, rgba(0,0,0,.035) 23px),
      linear-gradient(163deg, #63483a 0%, #4a3527 48%, #33241a 100%);
  }
  .wood-photo {
    background-image: url("wood.jpg"); background-size: cover; background-position: center;
    filter: brightness(1.12) saturate(1.06);
  }
  .vignette {
    background: radial-gradient(ellipse at 50% 42%,
      rgba(255,232,190,.13) 0%, rgba(0,0,0,0) 52%, rgba(0,0,0,.38) 100%);
  }

  .mat-wrap { position: relative; }
  .mat {
    position: relative; background: var(--board); border-radius: 4.5%;
    display: grid; place-items: center; text-align: center;
    box-shadow: 0 2px 0 var(--board-sh), 0 3px 1px rgba(0,0,0,.35),
                0 26px 50px rgba(0,0,0,.55);
  }
  .mat::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background-image: var(--noise); opacity: .5; mix-blend-mode: multiply;
  }
  .mat::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(145deg, rgba(255,255,255,.5), rgba(0,0,0,0) 38%, rgba(0,0,0,.06));
  }
  .keyline { position: absolute; inset: 4.5%; border: 2px solid var(--red);
             border-radius: 2.5%; opacity: .85; }

  .content { position: relative; z-index: 2; padding: 0 8%; width: 100%; }

  .kicker { font-family: Rubik, sans-serif; font-weight: 600; color: var(--red);
            text-transform: uppercase; }
  .q { font-family: 'Patua One', Georgia, serif; color: var(--ink);
       line-height: 1.13; text-wrap: balance; }

  .opts { display: grid; justify-content: center; }
  .opt {
    display: grid; grid-template-columns: auto 1fr; align-items: center;
    text-align: left; font-family: Rubik, sans-serif; font-weight: 500; color: var(--ink);
  }
  .opt b {
    display: grid; place-items: center; border-radius: 50%;
    background: var(--red); color: #fff; font-weight: 600;
  }


  /* Absender-Marke. Bewusst groß: In der Gemeinde ist „Team Michelhausen"
     als Name allein offenbar nicht bekannt genug — das Logo muss die
     Zuordnung leisten, nicht der Schriftzug. */
  .sender { display: flex; justify-content: center; }
  .sender img { display: block; width: auto; }
  .foot { font-family: Rubik, sans-serif; font-weight: 500; color: var(--ink); opacity: .7; }
  .flagbar { margin-inline: auto; border-radius: 99px;
             background: linear-gradient(90deg, var(--red) 0 45%, var(--green) 45% 63.3%,
                         var(--yellow) 63.3% 81.6%, var(--magenta) 81.6% 100%); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wood"></div>
  <div class="wood-photo"></div>
  <div class="vignette"></div>

  <div class="mat-wrap" id="matWrap">
    <div class="mat" id="mat">
      <div class="keyline"></div>
      <div class="content">
        <p class="kicker" id="kicker">Frage der Woche</p>
        <h1 class="q" id="q">Michelhausen ist in den letzten zehn Jahren gewachsen — um wie viel?</h1>
        <div class="opts" id="opts">
          <div class="opt"><b>A</b><span>um 20 Prozent</span></div>
          <div class="opt"><b>B</b><span>um 40 Prozent</span></div>
          <div class="opt"><b>C</b><span>um 60 Prozent</span></div>
        </div>
        <div class="flagbar" id="flagbar"></div>
        <p class="foot" id="foot">Antwort in die Kommentare — Auflösung morgen</p>
        <div class="sender" id="sender">
          <img id="logo" src="logo-trim.png" alt="SPÖ &amp; Unabhängige – Team Michelhausen">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var W = parseInt(p.get('w'), 10) || 1080;
  var H = parseInt(p.get('h'), 10) || 1350;

  var stage = document.getElementById('stage');
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';

  var mat = Math.round(Math.min(W, H) * (W === H ? 0.86 : 0.88));
  var m = document.getElementById('mat');
  m.style.width = mat + 'px';
  m.style.height = mat + 'px';
  document.getElementById('matWrap').style.transform = 'rotate(-1.9deg)';

  var u = mat / 100;
  function set(id, prop, v) { document.getElementById(id).style[prop] = (u * v) + 'px'; }

  set('kicker', 'fontSize', 3.6);
  document.getElementById('kicker').style.letterSpacing = (u * 0.44) + 'px';
  set('kicker', 'marginBottom', 3.2);

  set('q', 'fontSize', 6.0);
  set('q', 'marginBottom', 4.2);

  var opts = document.getElementById('opts');
  opts.style.gap = (u * 2.2) + 'px';
  opts.style.marginBottom = (u * 4.0) + 'px';
  [].forEach.call(document.querySelectorAll('.opt'), function (el) {
    el.style.fontSize = (u * 4.6) + 'px';
    el.style.gap = (u * 2.6) + 'px';
    var b = el.querySelector('b');
    b.style.width = (u * 7.4) + 'px';
    b.style.height = (u * 7.4) + 'px';
    b.style.fontSize = (u * 3.9) + 'px';
  });

  var fb = document.getElementById('flagbar');
  fb.style.width = (u * 24) + 'px';
  fb.style.height = (u * 1.3) + 'px';
  fb.style.marginBottom = (u * 3.0) + 'px';

  set('foot', 'fontSize', 3.2);
  set('foot', 'marginBottom', 3.2);
  document.getElementById('logo').style.height = (u * 12) + 'px';
})();
</script>
</body>
</html>
